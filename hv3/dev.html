<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>響V3 リグ確認</title>
<style>html,body{margin:0;height:100%;background:#7d8790}#stage{position:fixed;inset:0}</style></head>
<body><div id="stage"></div>
<script type="module">
// Development view: fixed poses for rendering checks (no animation).
import { RigModel } from './rig-eval.js';
import { AvatarRenderer } from './renderer.js';
try {
  const q = new URLSearchParams(location.search);
  const json = await (await fetch('hibiki.rig.json', { cache: 'no-store' })).json();
  const model = new RigModel(json);
  const r = await new AvatarRenderer().init(document.getElementById('stage'), model, location.href);
  const v = q.get('view') || 'face'; r.setView(v.includes(',') ? v.split(',').map(Number) : v);
  window.hv3 = { model, r, pose(p) { for (const k of Object.keys(model.values)) model.values[k] = model.parameters.find(x => x.id === k).default ?? 0; for (const [k, v] of Object.entries(p)) model.set(k, v); model.update(0); r.sync(); r.app.render(); }, view(v) { r.setView(v); r.app.render(); } };
  window.hv3.pose(JSON.parse(q.get('p') || '{}'));
  window.hv3ready = true;
} catch (e) { window.hv3error = e.message; console.error(e.stack); }
</script></body></html>
