<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>響V3 接続品質の比較試作</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f1f3f7;color:#243045;font:15px system-ui}main{max-width:1080px;margin:auto;padding:20px}h1{font-size:22px;margin:0 0 8px}p{line-height:1.7}header p{margin:0;color:#536176}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;margin-top:20px}#stage{position:relative;aspect-ratio:1122/1402;max-height:82vh;background:linear-gradient(#eaf1f8,#fff);border-radius:18px;overflow:hidden;touch-action:pan-y}#stage.dark{background:#142031}canvas{display:block;width:100%;height:100%;object-fit:contain}aside{background:white;padding:18px;border-radius:16px;align-self:start}button,a.download{display:inline-block;padding:11px 14px;border:1px solid #c7d3e3;background:white;color:#183454;border-radius:9px;margin:3px;cursor:pointer;text-decoration:none}button.primary{background:#244f9e;color:#fff;border-color:#244f9e}button[aria-pressed=true]{outline:2px solid #568ad3}label{display:block;margin:15px 0}label:has(input[type=checkbox]){margin:12px 0}input[type=range]{width:100%}small,#status{display:block;line-height:1.6;color:#536176}.hint{position:absolute;bottom:10px;left:12px;right:12px;text-align:center;background:#ffffffd9;border-radius:20px;font-size:12px;padding:6px;pointer-events:none}.buttons{display:flex;flex-wrap:wrap}details{margin-top:14px}a{color:#244f9e}@media(max-width:700px){main{padding:12px}.layout{grid-template-columns:1fr;gap:12px}#stage{max-height:none;width:min(100%,480px);margin:auto}aside{padding:14px}h1{font-size:20px}.hint{font-size:11px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style>
<main><header><h1>響V3 · 接続品質の比較試作</h1><p>顔・首・スーツをつなぐ連続メッシュ。胸・肩の呼吸と、頭に少し遅れる上半身の追従を確認できます。</p></header><div class="layout"><section id="stage"><div class="hint">左右をタップ・なぞると、視線と頭が追従します</div></section><aside><div class="buttons"><button class="primary" id="demo" aria-pressed="false">オートデモ</button><button id="reset">正面へ戻す</button><button id="blink">瞬き</button></div><p id="demoStatus" role="status">感情・発話・身体を組み合わせて再生</p><label>V2状態 <select id="state"><option value="idle">idle · 待機</option><option value="attention">attention · 注目</option><option value="thinking">thinking · 思考</option><option value="speaking">speaking · 発話</option><option value="happy">happy · 喜び</option><option value="notify">notify · 通知</option><option value="concern">concern · 心配</option><option value="error">error · エラー</option><option value="sleep">sleep · 休息</option><option value="wake">wake · 復帰</option></select></label><small id="phase">idle / normal</small><label>感情（状態と独立） <select id="emotion"><option value="auto">状態に合わせる</option><option value="neutral">中立</option><option value="gentle">微笑み</option><option value="smile">笑顔</option><option value="joy">喜び</option><option value="surprise">驚き</option><option value="concern">困惑</option><option value="sadness">悲しみ</option><option value="thinking">思考</option><option value="shy">照れ</option></select></label><label>頭の左右への追従 <input id="yaw" type="range" min="-1" max="1" step="0.01" value="0"></label><label>頭の上下への追従 <input id="pitch" type="range" min="-1" max="1" step="0.01" value="0"></label><label>微笑み <input id="smile" type="range" min="0" max="1" step="0.01" value="0"></label><label>口の開閉 <input id="mouth" type="range" min="0" max="1" step="0.01" value="0"></label><label><input id="idle" type="checkbox" checked> 呼吸と微細な待機動作</label><label><input id="static" type="checkbox"> 静止表示</label><label><input id="dark" type="checkbox"> 暗い背景で境界を見る</label><label><input id="wire" type="checkbox"> メッシュを表示</label><label>接合部を拡大 <select id="zoom"><option value="full">全体</option><option value="neck">顔・首・髪</option><option value="face">眼・口</option><option value="body">襟・肩・スーツ</option></select></label><p id="status">素材を読み込み中…</p><small>正面寄りの小さな動きを対象とします。大きな横顔・衣装交換の完成版ではありません。</small><details><summary>音量同期（端末内で処理）</summary><button id="chooseAudio">音声ファイル</button><input id="audioFile" type="file" accept="audio/*" hidden><button id="tone">テスト音量</button><button id="stopAudio">音声を停止</button><small id="audioStatus">音声なし · 発話状態では疑似口パク</small><small>ファイルはアップロードしません。マイクは使用しません。</small></details><details><summary>素材と比較</summary><p><a href="../../legacy.html" target="_blank">従来版を別タブで見る</a></p><p><a class="download" href="materials/hibiki-continuity.psd">レイヤーPSD</a><a class="download" href="materials/neutral-composite.png">素材の合成PNG</a></p></details></aside></div></main><script type="module">import('./app.js?v=emotion-20261022').catch(error=>{const stage=document.querySelector('#stage');stage.querySelector('canvas')?.remove();const img=new Image();img.src='../../assets/approved-front.png';img.alt='承認済みの響・静止表示';img.style.width='100%';stage.prepend(img);document.querySelector('#status').textContent='動作を開始できないため静止表示しています。 '+error.message;document.querySelectorAll('button,input,select').forEach(e=>e.disabled=true);window.studyError=error.message;});</script></html>
