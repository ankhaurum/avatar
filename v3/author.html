<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>響V3 原画・メッシュ制作</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9edf3;color:#253146;font:15px system-ui}header{padding:16px 24px;background:#fff;border-bottom:1px solid #ccd6e2}h1{font-size:20px;margin:0 0 8px}main{display:grid;grid-template-columns:minmax(300px,1fr) 310px;gap:18px;padding:18px;max-width:1400px;margin:auto}.stage{position:relative;width:min(100%,calc((100vh - 145px)*1964/1610));aspect-ratio:1964/1610;margin:auto;background:#f5f7fa;box-shadow:0 2px 18px #26355018}canvas{position:absolute;width:100%;height:100%;left:0;top:0}#overlay{touch-action:none}aside{background:white;padding:18px;border-radius:10px;overflow:auto;max-height:calc(100vh - 145px)}label{display:block;margin:14px 0 5px}select,button,input[type=file]{max-width:100%;padding:8px}select{width:100%}button{margin:6px 5px 6px 0;border:1px solid #b5c6dd;background:#f3f7fd;border-radius:6px;color:#20324e;cursor:pointer}p{line-height:1.65}.note{font-size:13px;color:#5c6677}#status{white-space:pre-wrap;font-size:13px}#error{color:#a12525}input[type=range]{width:100%}@media(max-width:720px){main{grid-template-columns:1fr}.stage{width:min(100%,calc(65vh*1964/1610))}aside{max-height:none}}</style>
<header><h1>響V3 — 原画・メッシュ制作</h1><span>制作中。自然さ・全身可動・Human Acceptanceは未完了です。</span></header>
<main><div class="stage"><canvas id="render"></canvas><canvas id="overlay" aria-label="選択したメッシュの頂点をドラッグして編集"></canvas></div><aside>
<div id="camera"><button data-view="all">全体を表示</button><button data-view="r">右手を拡大</button><button data-view="l">左手を拡大</button><button data-view="face">顔を拡大</button></div>
<label for="part">制作パーツ</label><select id="part"></select>
<label><input type="checkbox" id="wire" checked> メッシュと頂点を表示</label>
<label><input type="checkbox" id="solo"> 選択パーツだけ表示</label>
<label><input type="checkbox" id="hands"> 手の目標位置を操作</label>
<p class="note">手首の丸印をドラッグすると、肩の位置を基準に上腕・肘・前腕が追従します。</p>
<label for="parameter">制作パラメータ</label><select id="parameter"></select>
<input id="value" aria-label="パラメータ値" type="range" min="0" max="1" step="0.001" value="0"><output id="valueText"></output>
<label for="exactValue">パラメータ値を指定</label><input id="exactValue" type="number" step="any"><div id="keys"></div>
<label><input id="keyEdit" type="checkbox"> 選択した形状キーの頂点を編集</label>
<p class="note" id="editMode">基準形の頂点を編集します。</p>
<details><summary>局所厚みの形状キー</summary><label for="depthVertex">頂点番号（0から）</label><input id="depthVertex" type="number" min="0" step="1" value="0"><label for="depthValue">厚み補正（原画px）</label><input id="depthValue" type="number" step="0.1" value="0"><button id="readDepth">選択キーの厚みを読む</button><button id="applyDepth">厚み補正を適用</button><p class="note">パーツ・関節パラメータ・キー姿勢を選びます。途中姿勢では編集しません。保存JSONに含まれます。</p></details><button id="undo">頂点編集を戻す</button><button id="save">制作JSONを保存</button>
<label for="load">保存した制作JSONを読み込む</label><input id="load" type="file" accept="application/json,.json">
<p class="note">PNGはPSDからの書出し、JSONはメッシュ・形状キー・階層の編集データです。途中姿勢も同じ評価器で描画します。キー不足は読込みエラーとして表示します。</p>
<div id="status" role="status"></div><div id="error" role="alert"></div>
</aside></main><script type="module" src="author.mjs?approvedA=20"></script></html>
