<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>響V3 — 会話プレビュー</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eaf0f7;color:#23354d;font:15px system-ui}header{padding:18px 24px;background:#fff;border-bottom:1px solid #cbd8e7}h1{font-size:21px;margin:0 0 7px}header p{margin:0;color:#607089;font-size:13px}main{max-width:1300px;margin:auto;display:grid;grid-template-columns:minmax(300px,1fr) 300px;gap:20px;padding:20px}.stage{position:relative;aspect-ratio:2300/2200;max-height:calc(100vh - 145px);background:radial-gradient(ellipse at 50% 38%,#fff,#f2f6fc);border-radius:18px;overflow:hidden;box-shadow:0 12px 36px #253e6312}canvas{position:absolute;width:100%;height:100%;touch-action:none}aside{background:#fff;border-radius:16px;padding:20px;max-height:calc(100vh - 145px);overflow:auto}label{display:block;margin:16px 0 6px}select,input[type=file]{width:100%;padding:8px}button,a.button{display:inline-block;border:1px solid #b9cbe1;border-radius:7px;background:#f1f6ff;color:#244566;padding:9px;margin:5px 5px 5px 0;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#275d9b;color:white}#states{display:grid;grid-template-columns:1fr 1fr}#status{line-height:1.6;font-size:13px;color:#3d5776}#error{color:#a12b32;white-space:pre-wrap}summary{cursor:pointer}details{margin-top:18px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.small{font-size:12px;line-height:1.6;color:#687a90}@media(max-width:720px){main{grid-template-columns:1fr}.stage{width:100%;min-width:0;height:44vh;height:44svh;max-height:none;aspect-ratio:auto;position:sticky;top:0;z-index:2}aside{min-width:0;max-height:none}main{padding:10px;gap:10px}header{padding:12px}button,select,input[type=number]{min-height:44px;font-size:16px}input[type=number]{width:100%}}</style>
<header><h1>響V3 — 会話プレビュー</h1><p>承認原画Aを基準に制作中。指節の開閉、顔・肩の高角度と複合造形は制作中です。</p></header>
<main><section class="stage" aria-label="響の表示"><canvas id="avatar" aria-label="響V3"></canvas><canvas id="interaction" aria-label="左右の手を操作"></canvas></section><aside>
<div id="states" aria-label="会話状態"></div><button id="fullView">全体を表示</button><button id="bustView">バストアップ</button><button id="faceView">顔・表情を拡大</button>
<label for="wardrobe">衣装</label><select id="wardrobe"><option value="approved-neutral">承認済み通常衣装</option><option value="shirt-with-tie">シャツ＋ネクタイ</option><option value="shirt-without-tie">シャツ</option><option value="jacket-without-tie">ジャケット・ネクタイなし</option><option value="lower-material-exchange">下衣素材を交換</option></select><button id="neutral">原画の基準姿勢</button><button id="saveFrame">描画PNGを保存</button><details><summary>部位の制作操作</summary><label for="parameter">パラメータ</label><select id="parameter"></select><label for="poseValue">値</label><input id="poseValue" type="number" step="0.001"></details><label for="expression">表情</label><select id="expression"><option value="auto">会話に合わせる</option><option value="neutral">自然</option><option value="smile">微笑み</option><option value="puzzled">困惑</option><option value="surprised">驚き</option></select>
<label><input id="animate" type="checkbox" checked> 自然な動作</label>
<label><input id="hands" type="checkbox"> 左右の手を操作</label><button id="release">手動の姿勢を解除</button>
<label for="audio">ローカル音声</label><input id="audio" type="file" accept="audio/*"><button id="tone">音量同期を試す</button><button id="stopAudio">音声を停止</button>
<p class="small">音声は端末内で再生します。外部送信・マイク・外部TTSは使用しません。</p>
<p id="status" role="status">制作データを読み込んでいます…</p><p id="error" role="alert"></p>
<p class="small"><a href="../studies/continuity/legacy-preview.html">以前の接続品質プレビュー</a></p><details><summary>動作確認</summary><pre id="metrics"></pre><button id="saveMetrics">測定結果を保存</button><a class="button" href="author.html">原画・メッシュ制作へ</a></details>
</aside></main><script type="module" src="preview.mjs?approvedA=18"></script></html>
