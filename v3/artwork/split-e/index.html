<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>響V3 着せ替え素材の確認</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf0f4;color:#243246;font:16px/1.65 system-ui}main{max-width:1250px;margin:auto;padding:20px}h1{font-size:24px;margin:0}nav,.controls{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0}a{color:#245e92}label{display:flex;gap:6px;align-items:center}select,button{font:inherit;padding:8px}.stage{width:min(100%,560px);margin:auto;background:#fff;box-shadow:0 2px 16px #24324618}canvas{display:block;width:100%;height:auto}.notice{padding:10px 14px;background:#fff5dc;border-radius:6px}#status{white-space:pre-wrap}#error{color:#a52b2b}figure{margin:22px 0;background:white;padding:12px}figure img{display:block;width:100%;height:auto}figcaption{padding:8px}details{margin:20px 0}ul{padding-left:22px}@media(max-width:600px){main{padding:12px}.controls label{width:100%;justify-content:space-between}select{max-width:72%}}</style>
<main><h1>響V3 — 着せ替え素材の確認</h1><p>承認原画Aの顔・髪・体格を基準に、衣装の隠れ面と接合部分を制作しました。衣装を選ぶと、独立したPNG素材から組み直します。</p>
<p class="notice">静止した衣装の組立を確認する画面です。可動姿勢の造形、最終的な自然さ、Human Acceptanceは別に確認します。</p>
<nav><a href="hibiki-v3-wardrobe-e.psd">編集可能なPSD</a><a href="wardrobe-comparison.png">衣装比較画像</a><a href="material-manifest.json">素材と検証記録</a><a href="README.md">制作内容・確認範囲</a></nav>
<div class="controls"><label>衣装<select id="costume"><option value="approved-neutral">承認原画の衣装</option><option value="shirt-with-tie">シャツ＋ネクタイ</option><option value="shirt-without-tie">シャツのみ</option><option value="jacket-without-tie">ジャケット＋シャツ（ネクタイなし）</option><option value="lower-material-exchange">ジャケットを維持して下衣素材を交換</option></select></label><label>表示<select id="viewMode"><option value="parts">独立素材から組立</option><option value="psd">PSD再読込み画像</option><option value="source">承認原画A</option><option value="diff">組立とPSDの差分</option></select></label><label>背景<select id="background"><option value="#fff">白</option><option value="#20242b">暗色</option><option value="#b9c3ce">灰色</option></select></label></div>
<p id="status" role="status">素材を読み込み中…</p><p id="error" role="alert"></p><div class="stage"><canvas id="canvas" width="1024" height="1536" aria-label="独立した身体と衣装素材を合成した響"></canvas></div>
<details><summary>素材の構成を見る</summary><ul id="materials"></ul><p>原画と前回の14部品は保全しています。身体・ジャケット・シャツ・ネクタイ・下衣を別素材として保持し、衣装の下にある布地と身体接合面もPSDで編集できます。</p></details>
<figure><img src="wardrobe-comparison.png" alt="左から承認衣装、シャツとネクタイ、シャツのみ、ネクタイなしのジャケット"><figcaption>衣装を外したときに見える襟・胸・袖口・腰を比較します。</figcaption></figure><figure><img src="review-lower-material-exchange.png" alt="ジャケットを維持したまま下衣だけを交換した状態"><figcaption>ジャケットと下衣の素材を個別に交換した確認。</figcaption></figure></main>
<script type="module">
const $=s=>document.querySelector(s),canvas=$('#canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
try{const response=await fetch('material-manifest.json');if(!response.ok)throw Error('素材の記録を読み込めません。');const manifest=await response.json();const cache=new Map();
async function load(file){if(cache.has(file))return cache.get(file);const p=(async()=>{const image=new Image();image.src=file;await image.decode();if(image.naturalWidth!==1024||image.naturalHeight!==1536)throw Error('素材の寸法が異なります: '+file);return image;})();cache.set(file,p);return p;}
const byId=new Map(manifest.materials.map(m=>[m.id,m]));for(const m of manifest.materials){const li=document.createElement('li'),link=document.createElement('a');link.href=m.file;link.textContent=m.id;li.append(link);$('#materials').append(li);}let generation=0;
async function draw(){const stateName=$('#costume').selectedOptions[0].textContent;$('#status').textContent='読み込み中: '+stateName;const id=++generation,state=manifest.states[$('#costume').value],mode=$('#viewMode').value;if(!state)throw Error('衣装の記録がありません。');const imgs=await Promise.all(state.assembly.map(x=>{const m=byId.get(x);if(!m)throw Error('素材がありません: '+x);return load(m.file);}));const reference=mode==='source'?await load('../hibiki-static-a.png'):mode==='psd'||mode==='diff'?await load('reopened-'+$('#costume').value+'.png'):null;if(id!==generation)return;ctx.clearRect(0,0,1024,1536);for(const im of imgs)ctx.drawImage(im,0,0);let note='';if(mode==='diff'){const actual=ctx.getImageData(0,0,1024,1536);ctx.clearRect(0,0,1024,1536);ctx.drawImage(reference,0,0);const expected=ctx.getImageData(0,0,1024,1536);let changed=0,maxDelta=0;for(let i=0;i<actual.data.length;i+=4){const a=actual.data,e=expected.data;const delta=Math.max(Math.abs(a[i]*a[i+3]/255-e[i]*e[i+3]/255),Math.abs(a[i+1]*a[i+3]/255-e[i+1]*e[i+3]/255),Math.abs(a[i+2]*a[i+3]/255-e[i+2]*e[i+3]/255),Math.abs(a[i+3]-e[i+3]));maxDelta=Math.max(maxDelta,delta);if(delta>1)changed++;a[i]=delta>1?255:0;a[i+1]=0;a[i+2]=delta>1?80:0;a[i+3]=255;}ctx.putImageData(actual,0,0);note='ブラウザ比較の差分 > 1階調: '+changed+'画素、最大 '+maxDelta.toFixed(2)+'階調。';}else if(reference){ctx.clearRect(0,0,1024,1536);ctx.drawImage(reference,0,0);}$('#status').textContent=stateName+'：'+state.assembly.length+'個の独立素材を同じ1024×1536座標で組立。\n'+note+' PSD再読込みとPNG再合成の数値は検証記録に保存しています。';}
const redraw=()=>draw().catch(e=>$('#error').textContent=e.message);$('#costume').onchange=redraw;$('#viewMode').onchange=redraw;$('#background').onchange=()=>$('.stage').style.background=$('#background').value;await draw();
}catch(e){$('#status').textContent='素材の読み込みが完了していません。';$('#error').textContent=e.message;}
</script></html>
