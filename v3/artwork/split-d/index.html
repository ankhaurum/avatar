<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>響V3 原画A・分割PSD検証</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf0f4;color:#203044;font:16px/1.6 system-ui}main{max-width:1250px;margin:auto;padding:20px}h1{font-size:24px}nav,fieldset{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0}fieldset{border:1px solid #b3bfce}label{display:inline-flex;gap:6px;align-items:center}select,button{padding:8px;font:inherit}.stage{background:white;width:min(100%,550px);margin:auto}canvas{width:100%;height:auto;display:block}#result{white-space:pre-wrap}figure{margin:20px 0;background:#fff;padding:12px}figure img{width:100%;height:auto}a{color:#18548c}.note{padding:12px;background:#fff4d8}#error{color:#a02020}</style>
<main><h1>響V3 — 承認原画Aの分割・再合成</h1><p>原画のIdentity・体格・衣装を維持したPSD制作の途中検証です。</p><p class="note">隠れていた身体・衣装の下地は未完成です。衣装を非表示にすると不足が見えます。着せ替え完成・可動品質・Human Acceptanceを示す画面ではありません。</p>
<nav><a href="hibiki-v3-approved-split-d.psd">編集PSD</a><a href="verification.json">画素検証</a><a href="layer-map.json">レイヤー対応</a><a href="README.md">成果・未達・エラー調査</a></nav>
<label>表示<select id="mode"><option value="parts">パーツから再合成</option><option value="source">承認原画A</option><option value="diff">原画との差分（RGB・alpha）</option></select></label>
<label>背景<select id="background"><option value="#fff">白</option><option value="#202020">暗色</option><option value="#aab6c2">灰色</option></select></label>
<fieldset id="toggles"><legend>表示する部品グループ</legend><label><input type="checkbox" data-group="BODY" checked>身体の可視部分</label><label><input type="checkbox" data-group="jacket" checked>ジャケット</label><label><input type="checkbox" data-group="shirt" checked>シャツ</label><label><input type="checkbox" data-group="tie" checked>ネクタイ</label><label><input type="checkbox" data-group="lower" checked>下衣</label><button id="reset" type="button">すべて表示</button></fieldset>
<p id="result" role="status">画像を読み込み中…</p><p id="error" role="alert"></p><div class="stage"><canvas id="view" width="1024" height="1536" aria-label="原画・パーツ再合成の確認"></canvas></div>
<figure><img src="approved-recomposed-white.png" alt="白背景。左が承認原画、右がPSD再読込み後の合成"><figcaption>左：承認原画 ／ 右：PSD再読込み後</figcaption></figure><figure><img src="approved-recomposed-dark.png" alt="暗背景で同じ原画と再合成を比較"><figcaption>暗背景で毛先・半透明境界も確認</figcaption></figure><figure><img src="body-wardrobe-white.png" alt="左は可視身体のみ、右は衣装のみ。身体隠面の不足を示す"><figcaption>隠面が未完成であることを確認する分離表示</figcaption></figure></main>
<script type="module">
const $=s=>document.querySelector(s),canvas=$('#view'),ctx=canvas.getContext('2d',{willReadFrequently:true});
try{
 const response=await fetch('verification.json');if(!response.ok)throw Error('検証記録を取得できません');const report=await response.json();
 const load=async src=>{const im=new Image();im.src=src;await im.decode();if(im.naturalWidth!==1024||im.naturalHeight!==1536)throw Error('画像寸法が異なります: '+src);return im;};
 const source=await load('../hibiki-static-a.png');const parts=await Promise.all(report.parts.filter(p=>p.nonzeroAlphaPixels).map(async p=>({...p,image:await load(p.file)})));
 const enabled=p=>{const group=p.file.includes('/BODY_')?'BODY':['jacket','shirt','tie','lower'].find(k=>p.file.includes('WARDROBE_'+k));return !group||$('[data-group="'+group+'"]').checked;};
 function draw(){ctx.clearRect(0,0,1024,1536);const mode=$('#mode').value;if(mode==='source')ctx.drawImage(source,0,0);else{for(const p of parts)if(enabled(p))ctx.drawImage(p.image,0,0);if(mode==='diff'){const actual=ctx.getImageData(0,0,1024,1536);ctx.clearRect(0,0,1024,1536);ctx.drawImage(source,0,0);const original=ctx.getImageData(0,0,1024,1536);let count=0;for(let i=0;i<actual.data.length;i+=4){const a=actual.data,o=original.data;const delta=Math.max(Math.abs(a[i]*a[i+3]/255-o[i]*o[i+3]/255),Math.abs(a[i+1]*a[i+3]/255-o[i+1]*o[i+3]/255),Math.abs(a[i+2]*a[i+3]/255-o[i+2]*o[i+3]/255),Math.abs(a[i+3]-o[i+3]));if(delta>1)count++;a[i]=delta>1?255:0;a[i+1]=0;a[i+2]=delta>1?80:0;a[i+3]=255;}ctx.putImageData(actual,0,0);$('#result').textContent='ブラウザ合成の差分 > 1階調: '+count+'画素（色変換を含む参考値）。厳密なPNG比較はverification.json参照。';return;}}
 $('#result').textContent=(mode==='source'?'承認原画を表示':'PNG '+parts.filter(enabled).length+'部品を同一座標で合成')+'。PSD書出し・再読込の可視RGB差分0／alpha差分0。';}
 $('#mode').onchange=draw;$('#toggles').onchange=draw;$('#reset').onclick=()=>{document.querySelectorAll('[data-group]').forEach(x=>x.checked=true);draw();};$('#background').onchange=()=>$('.stage').style.background=$('#background').value;draw();
}catch(e){$('#result').textContent='読み込み未完了';$('#error').textContent=e.message;}
</script></html>
